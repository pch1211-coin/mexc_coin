<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEXC DASH Web</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="title">🚀 MEXC DASH Web</div>
      <div class="sub">* 가격은 5초마다 갱신 / MA30은 5분 캐시(서버)</div>
    </header>

    <section class="panel">
      <div class="panel-row">
        <div class="field">
          <label>와치리스트 심볼 선택</label>
          <select id="watchSelect"></select>
        </div>

        <div class="btns">
          <button id="btnAddCard">카드에 추가(최대: 모바일 6 / PC 12)</button>
          <button class="ghost" id="btnRemoveAll">카드 전체 제거</button>
        </div>
      </div>

      <div class="panel-row">
        <div class="field grow">
          <label>와치리스트에 심볼 추가 (BTCUSDT 또는 BTC_USDT)</label>
          <input id="watchInput" placeholder="예: COREUSDT" />
        </div>
        <button id="btnAddWatch">와치리스트 추가</button>

        <button class="danger" id="btnDelWatch">선택 심볼 삭제</button>
      </div>

      <div class="panel-row">
        <div class="field">
          <label>현재가 기준</label>
          <select id="priceMode">
            <option value="fair" selected>Fair Price (권장, PnL/ROI 더 잘 맞음)</option>
            <option value="last">Last Price (체결가)</option>
            <option value="index">Index Price (지수)</option>
          </select>
        </div>

        <div class="btns">
          <button id="btnStart">실시간 갱신 시작</button>
          <button class="ghost" id="btnStop" disabled>정지</button>
        </div>
      </div>
    </section>

    <main>
      <div id="grid" class="grid"></div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
