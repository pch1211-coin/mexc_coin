<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEXC DASH Web</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1b33;
      --panel2:#0c162b;
      --line:#223454;
      --text:#d7e3ff;
      --muted:#8ea7d6;

      --red:#ff4d4d;      /* 수익(+) */
      --blue:#4d79ff;     /* 손실(-) */
      --yellow:#ffd86b;   /* 근접/경고 */
      --green:#6ee7b7;

      --cardRadius:18px;
    }

    body{
      margin:0;
      background: radial-gradient(1200px 600px at 50% -200px, #163060, var(--bg));
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
    }

    .wrap{ max-width: 1400px; margin:0 auto; padding: 18px 14px 40px; }
    h1{ margin: 6px 0 14px; font-size: 28px; letter-spacing: .2px; }

    .topbar{
      display:flex; gap:12px; flex-wrap: wrap;
      align-items: center;
      background: rgba(15,27,51,.55);
      border:1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(8px);
    }

    .group{ display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    label{ color:var(--muted); font-size: 13px; }
    select, input, button{
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
    }
    button{
      cursor:pointer;
      background: linear-gradient(180deg, #142a55, #0b162d);
    }
    button.primary{
      background: linear-gradient(180deg, #0be0ff, #00a8ff);
      color:#00141f;
      border: none;
      font-weight: 800;
    }
    button.danger{
      border-color: #5b2a2a;
      background: linear-gradient(180deg, #3a1a1a, #1c0c0c);
      color:#ffd2d2;
    }

    .hint{ color: var(--muted); font-size: 13px; margin-top: 8px; }

    /* Cards grid: PC 12개 / 모바일 6개(세로 1열) */
    .grid{
      margin-top: 14px;
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 1100px){
      .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 820px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px){
      /* ✅ 모바일: 세로 방향(1열) */
      .grid{ grid-template-columns: 1fr; }
      h1{ font-size: 22px; }
    }

    .card{
      background: rgba(15,27,51,.72);
      border: 2px solid var(--line);
      border-radius: var(--cardRadius);
      padding: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
      transition: border-color .2s ease;
    }

    /* ✅ 수익/손실 카드 테두리 */
    .card.profit{ border-color: rgba(255,77,77,.9); }
    .card.loss{   border-color: rgba(77,121,255,.9); }

    .cardHead{
      display:flex; justify-content: space-between; align-items:center; gap:10px;
      margin-bottom: 8px;
    }
    .sym{ font-weight: 900; letter-spacing:.3px; }
    .pill{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--line);
      color: var(--muted);
      background: rgba(0,0,0,.18);
    }

    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 8px;
    }
    .formGrid .full{ grid-column: 1 / -1; }

    .k{
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .vline{
      font-size: 13px;
      display:flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(255,255,255,.08);
    }
    .vline:last-child{ border-bottom:none; }

    /* ✅ TP/SL 색상 */
    .tp{ color: var(--red); font-weight: 800; }
    .sl{ color: var(--blue); font-weight: 800; }

    /* ✅ 예상마진(PnL) 텍스트 색상 */
    .pnl.profit{ color: var(--red); font-weight: 900; }
    .pnl.loss{   color: var(--blue); font-weight: 900; }

    .roi{ color: var(--muted); font-weight: 800; }
    .roi.profit{ color: var(--red); }
    .roi.loss{   color: var(--blue); }

    .statusRow{
      display:flex; gap:8px; flex-wrap: wrap;
      margin-top: 10px;
    }
    .tag{
      font-size: 12px;
      border:1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(0,0,0,.18);
      color: var(--muted);
      user-select: none;
    }
    .tag.ok{ color:#0b1; border-color: rgba(110,231,183,.5); }
    .tag.warn{ color: #ffd86b; border-color: rgba(255,216,107,.5); }

    /* ✅ 근접 점멸 */
    @keyframes flash {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(1.35); }
      100% { filter: brightness(1); }
    }
    .flash{
      animation: flash .55s ease-in-out infinite;
    }

    .foot{
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      display:flex; justify-content: space-between; gap:8px;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(10,18,35,.92);
      border:1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      display:none;
      z-index: 9999;
      font-size: 13px;
    }
    .toast.show{ display:block; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📊 MEXC DASH Web</h1>

    <div class="topbar">
      <div class="group">
        <label>와치리스트 심볼 선택</label>
        <select id="watchSelect"></select>
        <button id="addCardBtn">카드에 추가(최대: 모바일 6 / PC 12)</button>
        <button id="removeCardBtn" class="danger">카드 제거</button>
      </div>

      <div class="group">
        <label>와치리스트에 심볼 추가(BTCUSDT 또는 BTC_USDT)</label>
        <input id="addWatchInput" placeholder="예: COREUSDT" />
        <button id="addWatchBtn">와치리스트 추가</button>
      </div>

      <div class="group">
        <label>와치리스트에서 선택 심볼 삭제</label>
        <button id="delWatchBtn" class="danger">와치리스트 삭제</button>
      </div>

      <div class="group">
        <label>현재가 기준</label>
        <select id="priceType">
          <option value="fair" selected>Fair Price (권장, PnL/ROI 더 잘 맞음)</option>
          <option value="last">Last Price</option>
          <option value="index">Index Price</option>
        </select>
        <button id="startBtn" class="primary">실시간 갱신 시작</button>
        <button id="stopBtn">정지</button>
      </div>

      <div class="hint">* 5초마다 가격 갱신 / MA30은 5분 캐시</div>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <div id="toast" class="toast"></div>

<script>
  // =========================
  // 설정
  // =========================
  const PRICE_REFRESH_MS = 5000;
  const MA30_CACHE_MS = 5 * 60 * 1000;

  const TREND_BAND_PCT = 0.3; // DASH와 동일 개념(밴드 안이면 이전 추세 유지)
  const DEFAULTS = {
    margin: 5.8,
    leverage: 20,
    entry: 0,
    side: "SHORT",
    tpPct: 1.5,
    slPct: 0.7,
    nearPct: 0.2,
  };

  // 모바일 6 / PC 12
  function maxCards(){
    return window.matchMedia("(max-width: 620px)").matches ? 6 : 12;
  }

  // =========================
  // localStorage 키
  // =========================
  const LS_WATCH = "mexc_watchlist_v1";
  const LS_CARDS = "mexc_cards_v1";
  const LS_TREND = "mexc_trend_v1"; // 심볼별 이전 트렌드 유지
  const LS_ALERT = "mexc_alert_v1"; // 손실 진동/경고 쿨다운

  // =========================
  // 상태
  // =========================
  let timer = null;
  const maCache = new Map(); // symbol -> {ts, ma30}
  const lastAlert = JSON.parse(localStorage.getItem(LS_ALERT) || "{}"); // symbol -> ts

  // =========================
  // 유틸
  // =========================
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(()=> el.classList.remove("show"), 1600);
  }

  function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
  function fmt(v, d=6){
    if (!Number.isFinite(v)) return "-";
    // BTC 같은 큰 숫자는 자리수 줄이기
    if (Math.abs(v) >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    return v.toFixed(d).replace(/0+$/,'').replace(/\.$/,'');
  }

  function normSymbol(sym){
    let s = String(sym||"").trim().toUpperCase();
    if (!s) return "";
    if (s.includes("_")) return s;
    if (s.endsWith("USDT")) return s.replace(/USDT$/, "_USDT");
    return s;
  }

  function loadJSON(key, fallback){
    try { return JSON.parse(localStorage.getItem(key) || "") ?? fallback; }
    catch { return fallback; }
  }
  function saveJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

  // =========================
  // Watchlist / Cards
  // =========================
  function defaultWatch(){
    return ["BTC_USDT","ETH_USDT","CORE_USDT","WLD_USDT","PI_USDT","DOGE_USDT"];
  }

  function getWatchlist(){
    const w = loadJSON(LS_WATCH, null);
    if (!Array.isArray(w) || w.length === 0){
      saveJSON(LS_WATCH, defaultWatch());
      return defaultWatch();
    }
    return w;
  }
  function setWatchlist(arr){
    const uniq = [...new Set(arr.map(normSymbol).filter(Boolean))];
    saveJSON(LS_WATCH, uniq);
  }

  function getCards(){
    const c = loadJSON(LS_CARDS, []);
    return Array.isArray(c) ? c : [];
  }
  function setCards(arr){
    saveJSON(LS_CARDS, arr);
  }

  function ensureSelect(){
    const sel = document.getElementById("watchSelect");
    const w = getWatchlist();
    sel.innerHTML = w.map(s=> `<option value="${s}">${s}</option>`).join("");
  }

  // =========================
  // API 호출 (우리 서버로!)
  // =========================
  async function apiTicker(symbol){
    const r = await fetch(`/api/ticker?symbol=${encodeURIComponent(symbol)}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "ticker fail");
    return j;
  }
  async function apiMA30(symbol){
    const now = Date.now();
    const c = maCache.get(symbol);
    if (c && now - c.ts < MA30_CACHE_MS) return c.ma30;

    const r = await fetch(`/api/ma30?symbol=${encodeURIComponent(symbol)}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "ma30 fail");
    maCache.set(symbol, { ts: now, ma30: j.ma30 });
    return j.ma30;
  }

  // =========================
  // Trend (밴드 유지)
  // =========================
  function getTrendStore(){
    return loadJSON(LS_TREND, {});
  }
  function setTrendStore(obj){
    saveJSON(LS_TREND, obj);
  }
  function calcTrend(price, ma30, prev){
    if (!price || !ma30) return "NONE";
    const upper = ma30 * (1 + TREND_BAND_PCT/100);
    const lower = ma30 * (1 - TREND_BAND_PCT/100);
    if (price >= lower && price <= upper) return prev || "NEUTRAL";
    if (price > upper) return "UP";
    if (price < lower) return "DOWN";
    return prev || "NEUTRAL";
  }
  function trendText(t){
    if (t==="UP") return "상승";
    if (t==="DOWN") return "하락";
    if (t==="NEUTRAL") return "중립";
    return "-";
  }

  // =========================
  // 계산(이전 DASH 방식 유지)
  // =========================
  function calcTP_SL(entry, tpPct, slPct){
    const longTP  = entry * (1 + tpPct/100);
    const longSL  = entry * (1 - slPct/100);
    const shortTP = entry * (1 - tpPct/100);
    const shortSL = entry * (1 + slPct/100);
    return { longTP, longSL, shortTP, shortSL };
  }

  function calcPnLRoi({side, entry, price, margin, leverage}){
    const size = margin * leverage; // ✅ 기존: Size=Margin*Lev
    if (!entry || !price || !margin || !leverage) return { size, pnl: 0, roi: 0 };
    const frac = (side === "SHORT") ? ((entry - price)/entry) : ((price - entry)/entry);
    const pnl = size * frac;               // ✅ PnL = Size * 변동률
    const roi = (pnl / margin) * 100;      // ✅ ROI = pnl/margin*100
    return { size, pnl, roi };
  }

  function isNear(price, target, nearPct){
    if (!price || !target) return false;
    return (Math.abs(price - target) / price * 100) <= nearPct;
  }
  function isHit(side, price, tp, sl){
    if (side==="LONG"){
      return { hitTP: price >= tp, hitSL: price <= sl };
    } else {
      return { hitTP: price <= tp, hitSL: price >= sl };
    }
  }

  // =========================
  // 카드 렌더
  // =========================
  function cardTemplate(symbol){
    const id = `card_${symbol.replace(/[^A-Z0-9_]/g,"")}`;
    return `
      <div class="card" id="${id}" data-sym="${symbol}">
        <div class="cardHead">
          <div class="sym">${symbol}</div>
          <div class="pill" id="${id}_updated">대기</div>
        </div>

        <div class="formGrid">
          <div>
            <div class="k">투자금(Margin)</div>
            <input type="number" step="0.0001" id="${id}_margin" value="${DEFAULTS.margin}">
          </div>
          <div>
            <div class="k">레버리지</div>
            <select id="${id}_lev">
              ${[1,2,3,5,10,20,25,50,75,100,125,150,200].map(v=>`<option value="${v}" ${v===DEFAULTS.leverage?"selected":""}>${v}x</option>`).join("")}
            </select>
          </div>

          <div class="full">
            <div class="k">진입가(Entry / Avg Price)</div>
            <input type="number" step="0.0000001" id="${id}_entry" value="${DEFAULTS.entry}">
          </div>

          <div>
            <div class="k">방향(롱/숏)</div>
            <select id="${id}_side">
              <option value="LONG">LONG</option>
              <option value="SHORT" selected>SHORT</option>
            </select>
          </div>
          <div>
            <div class="k">근접기준(%)</div>
            <input type="number" step="0.01" id="${id}_near" value="${DEFAULTS.nearPct}">
          </div>

          <div>
            <div class="k">목표수익(%)</div>
            <input type="number" step="0.01" id="${id}_tp" value="${DEFAULTS.tpPct}">
          </div>
          <div>
            <div class="k">손절(%)</div>
            <input type="number" step="0.01" id="${id}_sl" value="${DEFAULTS.slPct}">
          </div>
        </div>

        <div class="statusRow">
          <div class="tag" id="${id}_trend">트렌드: -</div>
          <div class="tag" id="${id}_status">상태: -</div>
        </div>

        <div style="margin-top:10px">
          <div class="vline"><span>현재가</span><span id="${id}_price">-</span></div>
          <div class="vline"><span>MA30</span><span id="${id}_ma30">-</span></div>

          <div class="vline">
            <span>Long TP/SL</span>
            <span>
              <span class="tp" id="${id}_ltp">-</span>
              /
              <span class="sl" id="${id}_lsl">-</span>
            </span>
          </div>

          <div class="vline">
            <span>Short TP/SL</span>
            <span>
              <span class="tp" id="${id}_stp">-</span>
              /
              <span class="sl" id="${id}_ssl">-</span>
            </span>
          </div>

          <div class="vline"><span>Size(USDT)</span><span id="${id}_size">-</span></div>

          <!-- ✅ 여기! 예상마진 텍스트가 빨강/파랑으로 바뀜 -->
          <div class="vline">
            <span>예상마진(PnL USDT)</span>
            <span id="${id}_pnl" class="pnl">-</span>
          </div>

          <div class="vline"><span>ROI(%)</span><span id="${id}_roi" class="roi">-</span></div>
        </div>

        <div class="foot">
          <span id="${id}_ptype"></span>
          <span id="${id}_time"></span>
        </div>
      </div>
    `;
  }

  function renderCards(){
    const grid = document.getElementById("grid");
    const cards = getCards();
    grid.innerHTML = cards.map(s => cardTemplate(s)).join("");
  }

  // =========================
  // 실시간 업데이트
  // =========================
  async function updateOne(symbol){
    const id = `card_${symbol.replace(/[^A-Z0-9_]/g,"")}`;

    const margin = num(document.getElementById(`${id}_margin`)?.value);
    const lev = num(document.getElementById(`${id}_lev`)?.value) || 1;
    const entry = num(document.getElementById(`${id}_entry`)?.value);
    const side = String(document.getElementById(`${id}_side`)?.value || "SHORT").toUpperCase();
    const tpPct = num(document.getElementById(`${id}_tp`)?.value) || 1.5;
    const slPct = num(document.getElementById(`${id}_sl`)?.value) || 0.7;
    const nearPct = num(document.getElementById(`${id}_near`)?.value) || 0.2;

    const priceType = document.getElementById("priceType").value;

    const cardEl = document.getElementById(id);
    const pnlEl = document.getElementById(`${id}_pnl`);
    const roiEl = document.getElementById(`${id}_roi`);

    // flash 초기화(매번 끄고 다시 켬)
    const flashTargets = [
      `${id}_ltp`, `${id}_lsl`, `${id}_stp`, `${id}_ssl`, `${id}_status`
    ].map(x => document.getElementById(x)).filter(Boolean);
    flashTargets.forEach(el => el.classList.remove("flash"));

    try{
      const t = await apiTicker(symbol);
      const price = (priceType==="fair") ? t.fair : (priceType==="last") ? t.last : (t.index ?? t.fair);

      // price 표시
      document.getElementById(`${id}_price`).textContent = fmt(price, 6);
      document.getElementById(`${id}_ptype`).textContent = `priceType: ${priceType}`;
      document.getElementById(`${id}_time`).textContent = new Date().toLocaleTimeString();
      document.getElementById(`${id}_updated`).textContent = "LIVE";

      // MA30 (캐시)
      let ma30 = 0;
      try{
        ma30 = await apiMA30(symbol);
        document.getElementById(`${id}_ma30`).textContent = fmt(ma30, 6);
      }catch(e){
        document.getElementById(`${id}_ma30`).textContent = "ERR";
      }

      // Trend
      const store = getTrendStore();
      const prev = store[symbol] || "";
      const tr = calcTrend(price, ma30, prev);
      store[symbol] = tr;
      setTrendStore(store);

      document.getElementById(`${id}_trend`).textContent = `트렌드: ${trendText(tr)}`;

      // TP/SL 계산
      const { longTP, longSL, shortTP, shortSL } = calcTP_SL(entry, tpPct, slPct);
      document.getElementById(`${id}_ltp`).textContent = fmt(longTP, 6);
      document.getElementById(`${id}_lsl`).textContent = fmt(longSL, 6);
      document.getElementById(`${id}_stp`).textContent = fmt(shortTP, 6);
      document.getElementById(`${id}_ssl`).textContent = fmt(shortSL, 6);

      // PnL/ROI
      const { size, pnl, roi } = calcPnLRoi({ side, entry, price, margin, leverage: lev });
      document.getElementById(`${id}_size`).textContent = fmt(size, 2);

      // ✅ 예상마진 텍스트 색상(수익 빨강 / 손실 파랑)
      pnlEl.textContent = fmt(pnl, 6);
      pnlEl.classList.remove("profit","loss");
      cardEl.classList.remove("profit","loss");
      roiEl.classList.remove("profit","loss");

      if (pnl > 0){
        pnlEl.classList.add("profit");
        cardEl.classList.add("profit");   // ✅ 카드 테두리 빨강
        roiEl.classList.add("profit");
      } else if (pnl < 0){
        pnlEl.classList.add("loss");
        cardEl.classList.add("loss");     // ✅ 카드 테두리 파랑
        roiEl.classList.add("loss");
      }

      roiEl.textContent = Number.isFinite(roi) ? roi.toFixed(4) : "-";

      // 상태/근접/터치 + 점멸
      const statusEl = document.getElementById(`${id}_status`);

      const tp = (side==="SHORT") ? shortTP : longTP;
      const sl = (side==="SHORT") ? shortSL : longSL;

      const nearTP = isNear(price, tp, nearPct);
      const nearSL = isNear(price, sl, nearPct);

      const { hitTP, hitSL } = isHit(side, price, tp, sl);

      let status = "-";
      if (hitSL){
        status = `${side} SL 터치/돌파`;
        // SL쪽 점멸
        const slId = (side==="SHORT") ? `${id}_ssl` : `${id}_lsl`;
        document.getElementById(slId)?.classList.add("flash");
        statusEl.classList.add("flash");
      } else if (hitTP){
        status = `${side} TP 터치/돌파`;
        // TP쪽 점멸
        const tpId = (side==="SHORT") ? `${id}_stp` : `${id}_ltp`;
        document.getElementById(tpId)?.classList.add("flash");
        statusEl.classList.add("flash");
      } else if (nearSL){
        status = `${side} SL 근접`;
        const slId = (side==="SHORT") ? `${id}_ssl` : `${id}_lsl`;
        document.getElementById(slId)?.classList.add("flash");
      } else if (nearTP){
        status = `${side} TP 근접`;
        const tpId = (side==="SHORT") ? `${id}_stp` : `${id}_ltp`;
        document.getElementById(tpId)?.classList.add("flash");
      }

      statusEl.textContent = `상태: ${status}`;

      // ✅ 손실 진동/경고 (모바일에서만 실제 진동 가능)
      // - 너무 자주 울리면 싫으니 15초 쿨다운
      if (pnl < 0){
        const now = Date.now();
        const last = lastAlert[symbol] || 0;
        if (now - last > 15000){
          lastAlert[symbol] = now;
          localStorage.setItem(LS_ALERT, JSON.stringify(lastAlert));

          // 진동 지원시만
          if (navigator.vibrate){
            navigator.vibrate([120, 80, 120]);
          }
          toast(`${symbol} 손실 발생: ${fmt(pnl,6)} USDT`);
        }
      }

    }catch(e){
      document.getElementById(`${id}_updated`).textContent = "ERR";
      document.getElementById(`${id}_status`).textContent = "상태: 가격 불러오기 실패";
    }
  }

  async function tick(){
    const cards = getCards();
    // 개수 제한(모바일 6 / PC 12)
    const limited = cards.slice(0, maxCards());
    if (limited.length !== cards.length){
      setCards(limited);
      renderCards();
      ensureSelect();
    }

    // 너무 오래 걸리면 화면 멈추니 순차(가벼운 카드 수)
    for (const s of limited){
      await updateOne(s);
    }
  }

  function start(){
    if (timer) return;
    toast("실시간 갱신 시작");
    tick();
    timer = setInterval(tick, PRICE_REFRESH_MS);
  }
  function stop(){
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    toast("정지");
  }

  // =========================
  // 버튼 이벤트
  // =========================
  function init(){
    // watchlist
    ensureSelect();

    // cards 초기값(없으면 1개만)
    const cards = getCards();
    if (cards.length === 0){
      setCards([getWatchlist()[0]]);
    }
    renderCards();

    document.getElementById("addWatchBtn").addEventListener("click", ()=>{
      const input = document.getElementById("addWatchInput");
      const sym = normSymbol(input.value);
      if (!sym) return toast("심볼을 입력하세요");
      const w = getWatchlist();
      if (w.includes(sym)) return toast("이미 존재하는 심볼");
      w.push(sym);
      setWatchlist(w);
      ensureSelect();
      input.value = "";
      toast("와치리스트 추가 완료");
    });

    document.getElementById("delWatchBtn").addEventListener("click", ()=>{
      const sel = document.getElementById("watchSelect");
      const sym = sel.value;
      const w = getWatchlist().filter(x => x !== sym);
      setWatchlist(w);
      // 카드에서도 제거
      const c = getCards().filter(x => x !== sym);
      setCards(c);
      ensureSelect();
      renderCards();
      toast("와치리스트 삭제 완료");
    });

    document.getElementById("addCardBtn").addEventListener("click", ()=>{
      const sym = document.getElementById("watchSelect").value;
      const cards = getCards();
      if (cards.includes(sym)) return toast("이미 카드가 있어요");
      if (cards.length >= maxCards()) return toast(`현재 화면 최대 ${maxCards()}개까지`);
      cards.push(sym);
      setCards(cards);
      renderCards();
      toast("카드 추가 완료");
    });

    document.getElementById("removeCardBtn").addEventListener("click", ()=>{
      const sym = document.getElementById("watchSelect").value;
      const cards = getCards().filter(x => x !== sym);
      setCards(cards);
      renderCards();
      toast("카드 제거 완료");
    });

    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("stopBtn").addEventListener("click", stop);

    // 화면 크기 바뀌면 최대카드 반영
    window.addEventListener("resize", ()=>{
      const cards = getCards().slice(0, maxCards());
      setCards(cards);
      renderCards();
    });
  }

  init();
</script>
</body>
</html>
