<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEXC Futures Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="title">🚀 MEXC Futures Dashboard</div>
      <div class="actions">
        <button id="btnWatchlist">Watchlist 관리</button>
        <button id="btnAddCard">카드 추가</button>
      </div>
    </header>

    <section class="grid" id="cards"></section>

    <!-- Watchlist Modal -->
    <div class="modal" id="wlModal" aria-hidden="true">
      <div class="modalBox">
        <div class="modalHead">
          <div class="modalTitle">Watchlist</div>
          <button id="btnCloseWl">닫기</button>
        </div>

        <div class="row">
          <input id="wlInput" placeholder="예: BTC_USDT, CORE_USDT" />
          <button id="btnAddSymbol">추가</button>
        </div>

        <div class="hint">
          * 심볼은 <b>BTC_USDT</b> 형태 권장. (USDT만 쓰면 자동 변환)
        </div>

        <div class="wlList" id="wlList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
