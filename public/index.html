<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEXC DASH Web</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title">
        <span class="rocket">🚀</span>
        <h1>MEXC DASH Web</h1>
      </div>
      <div class="sub">
        <span id="modeText">모드: PC</span>
        <span class="dot">•</span>
        <span id="ma30Timer">MA30: -</span>
      </div>
    </header>

    <section class="panel">
      <div class="panel-row">
        <div class="box">
          <label>와치리스트 심볼 선택</label>
          <div class="row">
            <select id="watchSelect"></select>
            <button id="btnAddCard" class="btn">카드에 추가</button>
            <button id="btnRemoveCard" class="btn ghost">카드 제거</button>
          </div>
          <div class="hint">* 모바일 최대 6개 / PC 최대 12개</div>
        </div>

        <div class="box">
          <label>와치리스트에 심볼 추가 (BTCUSDT 또는 BTC_USDT)</label>
          <div class="row">
            <input id="watchAddInput" placeholder="예: COREUSDT" />
            <button id="btnAddWatch" class="btn">와치리스트 추가</button>
          </div>
          <div class="hint">* 추가한 심볼은 브라우저에 저장됩니다(localStorage).</div>
        </div>

        <div class="box">
          <label>와치리스트에서 선택 심볼 삭제</label>
          <div class="row">
            <button id="btnRemoveWatch" class="btn danger">와치리스트 삭제</button>
          </div>
          <div class="hint">* 삭제하면 드롭다운에서도 사라집니다.</div>
        </div>

        <div class="box">
          <label>현재가 기준</label>
          <div class="row">
            <select id="priceBasis">
              <option value="fair" selected>Fair Price (권장, PnL/ROI 더 잘 맞음)</option>
              <option value="last">Last Price</option>
              <option value="index">Index Price</option>
            </select>
            <button id="btnStart" class="btn primary">실시간 갱신 시작</button>
            <button id="btnStop" class="btn ghost">정지</button>
          </div>
          <div class="hint">* 5초마다 가격 갱신 / MA30은 5분 캐시</div>
        </div>
      </div>
    </section>

    <main>
      <div id="grid" class="grid"></div>
    </main>

    <footer class="footer">
      <div>모바일 링크는 <b>PC 링크와 동일</b>합니다. (반응형이라 자동으로 모바일 UI로 바뀜)</div>
      <div class="small">예상마진(PnL): 수익(빨간색) / 손실(파란색)</div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
